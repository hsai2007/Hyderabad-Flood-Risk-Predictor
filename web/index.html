<!DOCTYPE html>
<html>
<head>
  <title>Hyderabad Flood Risk Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100vw; }

    #panel {
      position: absolute;
      top: 10px; right: 10px;
      z-index: 1000;
      background: white;
      border-radius: 10px;
      padding: 12px;
      width: 360px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      max-height: 90vh;
      overflow: auto;
    }
    #panel h2 { font-size: 15px; margin-bottom: 10px; color: #222; }

    .legend-item { display: flex; align-items: center; margin-bottom: 7px; font-size: 13px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }

    #stats { margin-top: 8px; border-top: 1px solid #eee; padding-top: 10px; font-size: 12px; color: #555; }
    #stats p { margin-bottom: 6px; }

    .chart-wrap { width: 100%; margin-top: 8px; }
    canvas.chart-canvas { width: 100% !important; height: 140px !important; }

    table#topTable { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
    table#topTable th { padding: 6px 8px; border: 1px solid #ddd; text-align: left; background: #f5f5f5; font-weight: 600; }
    table#topTable td { padding: 6px 8px; border: 1px solid #eee; text-align: left; }
    table#topTable tr:hover { background: #fafafa; }

    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 2000; background: white; padding: 20px 30px; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2); font-size: 15px; color: #333;
    }
  </style>
</head>
<body>

<div id="loading">⏳ Loading flood risk data...</div>
<div id="map"></div>

<div id="panel">
  <h2>🌊 Hyderabad Flood Risk</h2>

  <div class="legend-item"><div class="legend-dot" style="background:red"></div> Flooded drain</div>
  <div class="legend-item"><div class="legend-dot" style="background:orange"></div> High clog risk (&gt;50%)</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e6c800"></div> Medium risk (20–50%)</div>
  <div class="legend-item"><div class="legend-dot" style="background:green"></div> Low risk (&lt;20%)</div>
  <div class="legend-item"><div class="legend-dot" style="background:blue"></div> No risk data</div>

  <div id="stats">
    <p id="stat-total">Total pipes: –</p>
    <p id="stat-flooded">Flooded: –</p>
    <p id="stat-high">High risk: –</p>
  </div>

  <div class="chart-wrap">
    <canvas id="riskChart" class="chart-canvas"></canvas>
  </div>

  <div class="chart-wrap">
    <canvas id="clogChart" class="chart-canvas"></canvas>
  </div>

  <div>
    <table id="topTable">
      <thead>
        <tr>
          <th>From</th>
          <th>To</th>
          <th>Flow m³/s</th>
          <th>Overflow m³/s</th>
          <th>Flooded</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
var map = L.map("map").setView([17.38, 78.48], 12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap contributors"
}).addTo(map);

function safeNum(v, digits) {
  digits = digits || 3;
  return (v === undefined || v === null || isNaN(v)) ? "0.000" : Number(v).toFixed(digits);
}

fetch("http://127.0.0.1:5000/all_pipes")
  .then(r => r.json())
  .then(data => {
    document.getElementById("loading").style.display = "none";

    var total = 0, flooded = 0, high = 0;
    var counts = { red: 0, orange: 0, yellow: 0, green: 0, blue: 0 };

    L.geoJSON(data, {
      style: function(feature) {
        var color = feature.properties.risk_color || "blue";
        var weight = (color === "red") ? 5 : 2.5;
        return { color: color, weight: weight, opacity: 0.85 };
      },
      onEachFeature: function(feature, layer) {
        var p = feature.properties || {};
        total++;
        if (p.flooding === true) flooded++;
        if ((p.P_clog || 0) > 0.5) high++;

        var color = feature.properties.risk_color || "blue";
        counts[color] = (counts[color] || 0) + 1;

        layer.bindPopup(
          "<b>Drain Pipe</b><br>" +
          "Flow: " + safeNum(p.flow_m3s, 3) + " m³/s<br>" +
          "Overflow: " + safeNum(p.overflow_m3s, 3) + " m³/s<br>" +
          "Clog risk: " + safeNum((p.P_clog || 0) * 100, 1) + "%<br>" +
          "Flooded: " + (p.flooding ? "<b style='color:red'>YES</b>" : "No")
        );
      }
    }).addTo(map);

    document.getElementById("stat-total").textContent   = "Total pipes: " + total;
    document.getElementById("stat-flooded").textContent = "Flooded: " + flooded;
    document.getElementById("stat-high").textContent    = "High risk: " + high;

    try {
      var ctx = document.getElementById('riskChart').getContext('2d');
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Flooded', 'High', 'Medium', 'Low', 'No data'],
          datasets: [{
            data: [counts.red||0, counts.orange||0, counts.yellow||0, counts.green||0, counts.blue||0],
            backgroundColor: ['red', 'orange', '#e6c800', 'green', 'blue']
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom' } },
          maintainAspectRatio: false
        }
      });
    } catch(e) { console.warn('Chart error', e); }
  })
  .catch(err => {
    document.getElementById("loading").textContent = "Error loading data: " + err;
  });

fetch("http://127.0.0.1:5000/risk_points")
  .then(r => r.json())
  .then(points => {
    if (!Array.isArray(points)) return;

    points.forEach(function(p) {
      if (!p.lat || !p.lon) return;
      L.circleMarker([p.lat, p.lon], {
        radius: 8,
        color: p.flooding ? "red" : "orange",
        fillColor: p.flooding ? "red" : "orange",
        fillOpacity: 0.8,
        weight: 2
      }).bindPopup(
        "<b>High Risk Point</b><br>" +
        "Flow: " + safeNum(p.flow_m3s, 3) + " m³/s<br>" +
        "Overflow: " + safeNum(p.overflow_m3s, 3) + " m³/s<br>" +
        "Clog risk: " + safeNum((p.P_clog || 0) * 100, 1) + "%<br>" +
        "Flooded: " + (p.flooding ? "<b style='color:red'>YES</b>" : "No")
      ).addTo(map);
    });

    // Top 10 for bar chart — show overflow amounts
    var top = points.slice(0, 10);
    var labels = top.map(p => (p.from || '-') + '→' + (p.to || '-'));
    var dataVals = top.map(p => Math.round((p.overflow_m3s || 0) * 1000) / 1000);

    try {
      var clogCtx = document.getElementById('clogChart').getContext('2d');
      new Chart(clogCtx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Overflow (m³/s)',
            data: dataVals,
            backgroundColor: top.map(p => p.flooding ? 'rgba(220,50,50,0.8)' : 'rgba(255,160,50,0.8)')
          }]
        },
        options: {
          scales: { y: { beginAtZero: true } },
          plugins: { legend: { display: false } },
          maintainAspectRatio: false
        }
      });
    } catch(e) { console.warn('Chart error', e); }

    // Fill table — flooded pipes first, show flow and overflow
    var tbody = document.querySelector('#topTable tbody');
    if (tbody) {
      tbody.innerHTML = '';
      top.forEach(function(p) {
        var tr = document.createElement('tr');
        var floodCell = p.flooding
          ? "<td style='color:red; font-weight:600'>YES</td>"
          : "<td style='color:green'>No</td>";
        tr.innerHTML =
          '<td>' + (p.from || '') + '</td>' +
          '<td>' + (p.to || '') + '</td>' +
          '<td>' + safeNum(p.flow_m3s, 3) + '</td>' +
          '<td>' + safeNum(p.overflow_m3s, 3) + '</td>' +
          floodCell;
        tbody.appendChild(tr);
      });
    }
  })
  .catch(err => { console.warn('risk_points error', err); });
</script>
</body>
</html>
